services:
  server:
    build: ./server
    container_name: portfolio-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  client:
    build:
      context: ./client
      args:
        - VITE_REACT_APP_BACKEND_API_URL=${VITE_REACT_APP_BACKEND_API_URL}
    container_name: portfolio-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: portfolio-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  redis-data: